# log dir
log_dir: ./logs/test
lmdb: False
mode: text
dry_run: false
model_name: 'ds'
inter: 'none'
task_target: " "
save_avg: True
loss_rate: "10 * loss1 +  200 * loss_mse + 20* loss_intra + 10 *loss_inter"
vit_name: 'vit_tiny_patch16_224'
train_set: 'ori'
num_quires: 128
fusion_map: {0: 0, 1: 1, 2: 8, 3: 15}
clip_model_name: "ViT-L/14"
device: 'cuda:0'
mlp_dim: 256
mlp_out_dim: 128
head_num: 16  
# dataset
all_dataset: [valid_data]
train_dataset: []
test_dataset: [valid_data]
dataset_json_folder: 'dataset_json'
compression: c23  
train_batchSize: 20   
test_batchSize: 2   
workers: 0
frame_num: {'train': 32, 'test': 1000} 
resolution: 256   
with_mask: true   
with_xray: true
with_patch_labels: true
with_landmark: false   
# label settings
label_dict:
  DFDC_Fake: 1
  DFDC_Real: 0

use_data_augmentation: false  
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100
mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]

optimizer:
  type: adam
  adam: 
    lr: 0.0002
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false

lr_scheduler: null   
nEpochs: 60   
start_epoch: 0    
save_epoch: 2   
rec_iter: 100   
logdir: ./log  

manualSeed: 1020   
save_ckpt: true   
save_feat: false

metric_scoring: auc   
ngpu: 1   
cuda: true   
cudnn: true   
