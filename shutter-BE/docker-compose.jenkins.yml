services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
      - JAVA_OPTS=-Duser.timezone=Asia/Seoul
      - TZ=Asia/Seoul
    container_name: jenkins
    user: root # docker.sock 접근 권한 및 각종 호스트 파일 권한 확보
    ports:
      - "8010:8080" # 호스트 포트 8010
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Docker 호스트 데몬 공유 (DinD)
      - /etc/localtime:/etc/localtime:ro # 호스트 타임존 공유
      - ./nginx:/home/ubuntu/apps/S14P21A404/shutter-BE/nginx # Jenkinsfile 내 sed 처리를 위해 마운트 설정 추가
    restart: unless-stopped

volumes:
  jenkins_home:
