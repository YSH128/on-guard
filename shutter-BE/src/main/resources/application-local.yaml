spring:
  # ───── 로컬 개발 환경 설정 ─────
  docker:
    compose:
      enabled: false # 직접 docker compose up으로 컨테이너 관리
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:shutter}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    show-sql: true # 로컬에서만 SQL 출력

# Actuator - 로컬에서는 모든 엔드포인트 노출
management:
  endpoints:
    web:
      exposure:
        include: "*"

# 로컬 로그 설정
logging:
  level:
    root: INFO
    com.shutter: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Swagger UI (로컬에서만 활성화)
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

# Kakao OAuth
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
  admin-key: ${KAKAO_ADMIN_KEY}


# JWT
jwt:
  secret: ${JWT_SECRET}
  access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:3600000} # 기본 1시간
  refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:1209600000} # 기본 14일