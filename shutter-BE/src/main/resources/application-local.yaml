spring:
  # ───── 로컬 개발 환경 설정 ─────
  docker:
    compose:
      enabled: false # 직접 docker compose up으로 컨테이너 관리
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:shutter}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    show-sql: true # 로컬에서만 SQL 출력

# Actuator - 로컬에서는 모든 엔드포인트 노출
management:
  endpoints:
    web:
      exposure:
        include: "*"

# 로컬 로그 설정
logging:
  level:
    root: INFO
    com.shutter: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Swagger UI (로컬에서만 활성화)
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
