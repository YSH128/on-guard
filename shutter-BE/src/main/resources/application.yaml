spring:
  application:
    name: shutter
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # 공통 설정
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

# Actuator (공통 - 헬스체크는 항상 열어둠)
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
