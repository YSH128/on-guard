apiVersion: 1

datasources:
  - name: Shutter MySQL
    type: mysql
    uid: shutter-mysql
    url: mysql:3306
    database: ${DB_NAME}
    user: ${DB_USERNAME}
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      maxOpenConns: 10
      maxIdleConns: 10
      connMaxLifetime: 14400
    isDefault: true
    editable: true
