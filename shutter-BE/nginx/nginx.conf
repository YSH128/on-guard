events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ───── HTTP → HTTPS 리다이렉트 ─────
    server {
        listen 80;
        server_name j14a404.p.ssafy.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ───── HTTPS 설정 ─────
    server {
        listen 443 ssl;
        server_name j14a404.p.ssafy.io;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            # Docker 내부 DNS로 매번 resolve → 컨테이너 재생성 후 IP 변경 대응
            resolver 127.0.0.11 valid=5s;
            set $upstream spring-blue;  # 배포 전환 시 Jenkinsfile이 이 값을 변경
            proxy_pass         http://$upstream:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ───── Jenkins (CI/CD) Proxy ─────
        location /jenkins/ {
            proxy_pass         http://172.26.10.56:8010/jenkins/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            client_max_body_size 100M;
        }

        # Actuator 헬스체크 엔드포인트 (외부 직접 접근 차단)
        location /actuator/ {
            return 403;
        }
    }
}