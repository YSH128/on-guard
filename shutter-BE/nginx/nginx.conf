events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ───── Upstream (Blue-Green 배포 전환 포인트) ─────
    # 배포 전환 시 blue <-> green으로 바꾸고 nginx reload
    upstream spring-app {
        server spring-blue:8080;   # Blue 서버 (포트 8080)
        # server spring-green:8080; # Green 서버 (배포 전환 시 주석 전환)
    }

    # ───── HTTP → HTTPS 리다이렉트 ─────
    server {
        listen 80;
        server_name j14a404.p.ssafy.io;  # EC2 도메인 배정 후 변경 (예: i14a404.p.ssafy.io)

        # Let's Encrypt 인증서 발급 시 사용 (도메인 소유 확인용)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 모든 HTTP 요청을 HTTPS로 리다이렉트
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ───── HTTPS 설정 (도메인 + SSL 인증서 발급 후 활성화) ─────
    server {
        listen 443 ssl;
        server_name j14a404.p.ssafy.io;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            proxy_pass         http://spring-app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Actuator 헬스체크 엔드포인트 (외부 직접 접근 차단)
        location /actuator/ {
            return 403;
        }
    }
}
