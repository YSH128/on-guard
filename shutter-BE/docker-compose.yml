services:
  # ───── Nginx Reverse Proxy ─────
  nginx:
    image: "nginx:alpine"
    profiles:
      - prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/upstream.conf # ← 배포 시 Jenkins가 덮어씀
      - /etc/letsencrypt/live/j14a404.p.ssafy.io/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/j14a404.p.ssafy.io/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - shutter-network
    restart: unless-stopped

  # ───── Spring App (Blue) - 현재 운영 중인 버전 ─────
  spring-blue:
    profiles:
      - blue
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-blue
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRY_MS=${JWT_ACCESS_EXPIRY_MS}
      - JWT_REFRESH_EXPIRY_MS=${JWT_REFRESH_EXPIRY_MS}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - shutter-network
    restart: unless-stopped

  # ───── Spring App (Green) - 배포 대기 버전 ─────
  spring-green:
    profiles:
      - green
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-green
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRY_MS=${JWT_ACCESS_EXPIRY_MS}
      - JWT_REFRESH_EXPIRY_MS=${JWT_REFRESH_EXPIRY_MS}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - shutter-network

  # ───── MySQL ─────
  mysql:
    image: "mysql:8.0"
    ports:
      - "${EXTERNAL_DB_PORT:-3307}:3306"
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_USER=${DB_USERNAME}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shutter-network
    restart: unless-stopped

  # ───── Redis ─────
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shutter-network
    restart: unless-stopped

  # ───── Grafana ─────
  grafana:
    image: "grafana/grafana:latest"
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shutter-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  grafana_data:
  certbot-webroot:

networks:
  shutter-network:
    driver: bridge
